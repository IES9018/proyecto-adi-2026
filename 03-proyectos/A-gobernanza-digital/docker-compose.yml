version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: gobernanza-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./08_CODIGO_FUENTE/frontend
      dockerfile: Dockerfile
    container_name: gobernanza-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./08_CODIGO_FUENTE/backend
      dockerfile: Dockerfile
    container_name: gobernanza-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://gobernanza:${DB_PASSWORD}@postgres:5432/gobernanza
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-1025}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: gobernanza-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=gobernanza
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=gobernanza
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobernanza"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
